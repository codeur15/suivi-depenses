<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi des Dépenses</title>

    <!-- FullCalendar CDN -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/locales/fr.js"></script>

    <!-- Style de base -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffffff;
        }

        .login-container input, .login-container button {
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .error {
            color: red;
            font-size: 0.9em;
        }

        #main-content {
            display: none;
            padding: 20px;
        }

        #calendar {
            margin-top: 20px;
        }

        .expense-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 5px;
            background-color: #f1f1f1;
            border-radius: 5px;
        }

        .expense-item button {
            background-color: #ff4d4d;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
        }

        .expense-item button:hover {
            background-color: #ff0000;
        }

        .fc-daygrid-day-selected {
            background-color: #f0f0f0 !important;
        }

        .expense-form input, .expense-form button {
            margin-top: 10px;
            padding: 8px;
            border-radius: 5px;
        }

        .logout-btn {
            margin-top: 20px;
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background-color: #45a049;
        }

        /* Modale pour définir le solde */
        .modal-container {
            background: rgba(0, 0, 0, 0.5);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            display: none;
        }

        .modal-content {
            background-color: white;
            padding: 20px;
            margin: 20% auto;
            width: 300px;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

    <!-- Section de Connexion -->
    <div id="login-container" class="login-container">
        <div>
            <h2>Connexion</h2>
            <input type="password" id="password" placeholder="Entrez votre mot de passe" />
            <button id="login-btn">Se connecter</button>
            <div id="error-message" class="error"></div>
        </div>
    </div>

    <!-- Solde Mensuel et Calendrier, masqués si non connecté -->
    <div id="main-content">
        <h2>Solde du mois de <span id="current-month"></span> : <span id="current-balance">0</span> FCFA</h2>
        <button id="set-balance-btn">Définir/Modifier le Solde du Mois</button>

        <div class="main-container">
            <div id="calendar"></div>

            <div id="expense-list" class="expense-list">
                <h3 id="selected-date-title">Dépenses du jour :</h3>
                <div id="expenses-for-day"></div>
            </div>
        </div>

        <!-- Formulaire pour ajouter des dépenses -->
        <div class="expense-form">
            <h3>Ajouter une Dépense :</h3>
            <input type="text" id="expense-description" placeholder="Description de la dépense" />
            <input type="number" id="expense-amount" placeholder="Montant" />
            <button id="save-expense-btn">Enregistrer la Dépense</button>
        </div>

        <button id="logout-btn" class="logout-btn">Se Déconnecter</button>
    </div>

    <!-- Modale pour définir le solde du mois -->
    <div id="set-balance-modal" class="modal-container">
        <div class="modal-content">
            <h3>Définir le Solde du Mois</h3>
            <input type="number" id="new-balance" placeholder="Entrez le solde du mois" />
            <button id="save-balance-btn">Enregistrer le Solde</button>
            <button id="cancel-btn">Annuler</button>
        </div>
    </div>

    <script>
        function getCurrentMonth() {
            const now = new Date();
            const monthNames = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
            return monthNames[now.getMonth()];
        }

        document.getElementById("current-month").textContent = getCurrentMonth();

        const storedPassword = localStorage.getItem("user_password");

        function showLoginPage() {
            document.getElementById("login-container").style.display = "block";
            document.getElementById("main-content").style.display = "none";
        }

        if (storedPassword) {
            document.getElementById("login-container").style.display = "none";
            document.getElementById("main-content").style.display = "block";
        } else {
            showLoginPage();
        }

        document.getElementById("login-btn").addEventListener("click", function() {
            const enteredPassword = document.getElementById("password").value;

            if (!storedPassword) {
                if (enteredPassword.length >= 6) {
                    localStorage.setItem("user_password", enteredPassword);
                    window.location.reload();
                } else {
                    document.getElementById("error-message").textContent = "Le mot de passe doit comporter au moins 6 caractères.";
                }
            } else {
                if (enteredPassword === storedPassword) {
                    document.getElementById("login-container").style.display = "none";
                    document.getElementById("main-content").style.display = "block";
                } else {
                    document.getElementById("error-message").textContent = "Mot de passe incorrect.";
                }
            }
        });

        let currentBalance = parseFloat(localStorage.getItem("expense_balance") || 0);
        const currentBalanceDisplay = document.getElementById("current-balance");
        currentBalanceDisplay.textContent = currentBalance;

        let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

        const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'dayGridMonth',
            locale: 'fr',
            height: 500,
            events: [],
            dateClick: function(info) {
                const selectedDate = info.dateStr;
                const dateTitle = document.getElementById("selected-date-title");
                const date = new Date(selectedDate);
                dateTitle.innerHTML = `Dépenses du ${date.getDate()}/${date.getMonth() + 1}/${date.getFullYear()}`;

                document.querySelectorAll('.fc-daygrid-day').forEach(day => {
                    day.classList.remove('fc-daygrid-day-selected');
                });
                info.dayEl.classList.add('fc-daygrid-day-selected');

                const expensesForDay = expenses.filter(exp => exp.date === selectedDate);
                const expensesForDayContainer = document.getElementById("expenses-for-day");
                expensesForDayContainer.innerHTML = '';
                if (expensesForDay.length > 0) {
                    expensesForDay.forEach(exp => {
                        const expenseItem = document.createElement('div');
                        expenseItem.classList.add('expense-item');
                        expenseItem.innerHTML = `
                            <span>${exp.description} - ${exp.amount} FCFA</span>
                            <button class="delete-expense-btn" data-description="${exp.description}" data-date="${exp.date}" data-amount="${exp.amount}">Supprimer</button>
                        `;
                        expensesForDayContainer.appendChild(expenseItem);
                    });
                } else {
                    expensesForDayContainer.innerHTML = "Aucune dépense pour cette date.";
                }
            }
        });

        calendar.render();

        document.getElementById("save-expense-btn").addEventListener("click", function() {
            const description = document.getElementById("expense-description").value;
            const amount = parseFloat(document.getElementById("expense-amount").value);
            const date = calendar.getDate().toISOString().split('T')[0];

            if (description && !isNaN(amount)) {
                expenses.push({ description, amount, date });

                currentBalance -= amount;
                localStorage.setItem("expense_balance", currentBalance);
                currentBalanceDisplay.textContent = currentBalance;

                localStorage.setItem("expenses", JSON.stringify(expenses));
                location.reload();
            }
        });

        document.addEventListener("click", function(event) {
            if (event.target.classList.contains("delete-expense-btn")) {
                const description = event.target.getAttribute("data-description");
                const date = event.target.getAttribute("data-date");
                const amount = parseFloat(event.target.getAttribute("data-amount"));

                expenses = expenses.filter(exp => !(exp.description === description && exp.date === date));

                currentBalance += amount;
                localStorage.setItem("expense_balance", currentBalance);
                currentBalanceDisplay.textContent = currentBalance;

                localStorage.setItem("expenses", JSON.stringify(expenses));
                location.reload();
            }
        });

        document.getElementById("logout-btn").addEventListener("click", function() {
            localStorage.removeItem("user_password");
            location.reload();
        });

        document.getElementById("set-balance-btn").addEventListener("click", function() {
            document.getElementById("set-balance-modal").style.display = "block";
        });

        document.getElementById("save-balance-btn").addEventListener("click", function() {
            const newBalance = parseFloat(document.getElementById("new-balance").value);
            if (!isNaN(newBalance)) {
                currentBalance = newBalance;
                localStorage.setItem("expense_balance", currentBalance);
                currentBalanceDisplay.textContent = currentBalance;
                document.getElementById("set-balance-modal").style.display = "none";
                location.reload();
            }
        });

        document.getElementById("cancel-btn").addEventListener("click", function() {
            document.getElementById("set-balance-modal").style.display = "none";
        });
    </script>
</body>
</html>
